<svg width="1120" height="720" viewBox="0 0 1120 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Forge terminal screenshot</title>
  <desc id="desc">A styled terminal preview showing Agent-Forge scanning a repository and generating SKILL.md and mcp-config.json.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#061B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="96" x2="940" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="40" y="40" width="1040" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1120" height="720" fill="url(#bg)"/>
  <circle cx="930" cy="88" r="180" fill="#0EA5E9" opacity="0.11"/>
  <circle cx="150" cy="650" r="220" fill="#8B5CF6" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="80" y="72" width="960" height="576" rx="18" fill="#0B1020" stroke="#1E293B" stroke-width="2"/>
    <rect x="80" y="72" width="960" height="48" rx="18" fill="#111827"/>
    <circle cx="112" cy="96" r="7" fill="#FB7185"/>
    <circle cx="136" cy="96" r="7" fill="#FBBF24"/>
    <circle cx="160" cy="96" r="7" fill="#34D399"/>
    <text x="520" y="102" fill="#94A3B8" font-family="Consolas, 'SFMono-Regular', monospace" font-size="14" text-anchor="middle">agent-forge.exe ./examples/pattern-service</text>
    <text x="126" y="158" fill="url(#accent)" font-family="Consolas, 'SFMono-Regular', monospace" font-size="22" font-weight="700">
      <tspan x="126" dy="0">    _                    __        ______</tspan>
      <tspan x="126" dy="28">   / \   __ _  ___ _ __ / /_      / / ___|___  _ __ ___  ___</tspan>
      <tspan x="126" dy="28">  / _ \ / _` |/ _ \ '_ \ '_ \ /\ / / |   / _ \| '__/ _ \/ __|</tspan>
      <tspan x="126" dy="28"> / ___ \ (_| |  __/ | | | | | \ V /| |__| (_) | | |  __/\__ \</tspan>
      <tspan x="126" dy="28">/_/   \_\__, |\___|_| |_|_| |_| \_/  \____\___/|_|  \___||___/</tspan>
    </text>
    <text x="126" y="334" fill="#CBD5E1" font-family="Consolas, 'SFMono-Regular', monospace" font-size="18">
      <tspan fill="#67E8F9">Context condensation</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#93C5FD">OpenAPI-first</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#C4B5FD">MCP stdio catalog</tspan>
    </text>
    <rect x="126" y="372" width="760" height="16" rx="8" fill="#1E293B"/>
    <rect x="126" y="372" width="622" height="16" rx="8" fill="#22D3EE"/>
    <text x="126" y="422" fill="#E2E8F0" font-family="Consolas, 'SFMono-Regular', monospace" font-size="18">Discovered 6 entry point(s)</text>
    <text x="126" y="466" fill="#94A3B8" font-family="Consolas, 'SFMono-Regular', monospace" font-size="16">
      <tspan x="126" dy="0">Generated ./examples/pattern-service/SKILL.md</tspan>
      <tspan x="126" dy="28">Generated ./examples/pattern-service/mcp-config.json</tspan>
      <tspan x="126" dy="44" fill="#F8FAFC">Press Enter to close...</tspan>
    </text>
    <rect x="742" y="430" width="214" height="112" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="766" y="464" fill="#E2E8F0" font-family="Consolas, 'SFMono-Regular', monospace" font-size="15">
      <tspan x="766" dy="0">SKILL.md</tspan>
      <tspan x="766" dy="28" fill="#94A3B8">mcp-config.json</tspan>
      <tspan x="766" dy="28" fill="#67E8F9">agent-forge serve</tspan>
    </text>
  </g>
</svg>
