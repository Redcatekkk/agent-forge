[package]
name = "agent-forge"
version = "0.1.0"
edition = "2024"
description = "Generate SKILL.md and MCP tool configuration from existing codebases"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
handlebars = "6"
ignore = "0.4"
indicatif = "0.18"
inquire = "0.9"
once_cell = "1"
regex = "1"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
